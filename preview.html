<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 智能客服 Agent - 预览版</title>
<style>
:root {
  --primary: #4F6EF7;
  --primary-light: #EEF1FE;
  --primary-dark: #3A54D4;
  --accent: #22C55E;
  --danger: #EF4444;
  --danger-light: #FEE2E2;
  --warning: #F59E0B;
  --warning-light: #FEF3C7;
  --tool-bg: #F0FDF4;
  --tool-border: #BBF7D0;
  --tool-text: #166534;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-lg: 0 8px 30px rgba(0,0,0,.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); background: var(--gray-100); color: var(--gray-900); height:100vh; display:flex; justify-content:center; overflow:hidden; }

.app { width:100%; max-width:430px; height:100vh; background:#fff; display:flex; flex-direction:column; box-shadow: var(--shadow-lg); position:relative; }

.app-header { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; z-index:10; }
.app-header .avatar { width:40px; height:40px; background:rgba(255,255,255,.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
.app-header .info h1 { font-size:17px; font-weight:600; }
.app-header .info p { font-size:11px; opacity:.85; margin-top:2px; }
.app-header .badge { margin-left:auto; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:20px; font-size:10px; }

.tab-bar { display:flex; background:#fff; border-bottom:1px solid var(--gray-200); flex-shrink:0; }
.tab-btn { flex:1; padding:10px 0; text-align:center; font-size:13px; font-weight:500; color:var(--gray-400); background:none; border:none; cursor:pointer; position:relative; }
.tab-btn.active { color:var(--primary); }
.tab-btn.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:30px; height:3px; background:var(--primary); border-radius:3px 3px 0 0; }
.tab-btn .icon { font-size:18px; display:block; margin-bottom:1px; }
.tab-badge { position:absolute; top:4px; right:calc(50% - 36px); background:var(--danger); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; font-weight:600; }

.page { display:none; flex:1; overflow:hidden; flex-direction:column; }
.page.active { display:flex; }

.chat-messages { flex:1; overflow-y:auto; padding:16px; background:var(--gray-50); display:flex; flex-direction:column; gap:12px; -webkit-overflow-scrolling:touch; }
.time-divider { text-align:center; font-size:11px; color:var(--gray-400); margin:4px 0; }

.msg { display:flex; gap:8px; max-width:88%; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg .msg-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.msg.ai .msg-avatar { background:var(--primary-light); }
.msg.user .msg-avatar { background:var(--gray-200); }
.msg .bubble { padding:10px 14px; border-radius:var(--radius-sm); font-size:14px; line-height:1.6; word-break:break-word; }
.msg.ai .bubble { background:#fff; color:var(--gray-900); border-top-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.msg.user .bubble { background:var(--primary); color:#fff; border-top-right-radius:4px; }

/* 工具调用卡片 */
.tool-trace { margin-top:8px; padding:8px 10px; background:var(--tool-bg); border:1px solid var(--tool-border); border-radius:8px; font-size:11px; color:var(--tool-text); line-height:1.7; }
.tool-trace .tool-title { font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:4px; }
.tool-trace .tool-step { display:flex; align-items:flex-start; gap:6px; padding:2px 0; }
.tool-trace .tool-icon { flex-shrink:0; }
.tool-trace .tool-result { color:var(--gray-500); font-size:11px; margin-top:2px; padding-left:18px; }

/* 工单卡片 */
.ticket-card { background:var(--warning-light); border:1px solid #FCD34D; border-radius:var(--radius-sm); padding:10px 12px; margin-top:8px; font-size:12px; color:#92400E; line-height:1.6; }
.ticket-card.urgent { background:var(--danger-light); border-color:#FCA5A5; color:#991B1B; }
.ticket-card .ticket-id { font-weight:700; font-size:13px; }

/* 正在输入 */
.typing { display:flex; gap:8px; }
.typing .dots { background:#fff; padding:12px 16px; border-radius:var(--radius-sm); border-top-left-radius:4px; display:flex; gap:4px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.typing .dots span { width:7px; height:7px; background:var(--gray-300); border-radius:50%; animation:blink 1.4s infinite both; }
.typing .dots span:nth-child(2) { animation-delay:.2s; }
.typing .dots span:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

.quick-questions { padding:10px 16px; background:#fff; border-top:1px solid var(--gray-100); display:flex; gap:8px; overflow-x:auto; flex-shrink:0; -webkit-overflow-scrolling:touch; }
.quick-questions::-webkit-scrollbar { display:none; }
.quick-btn { padding:7px 14px; background:var(--primary-light); color:var(--primary); border:none; border-radius:20px; font-size:13px; white-space:nowrap; cursor:pointer; flex-shrink:0; }
.quick-btn:active { background:#DDE3FC; }

.chat-input { padding:10px 16px; background:#fff; border-top:1px solid var(--gray-200); display:flex; gap:10px; align-items:flex-end; flex-shrink:0; }
.chat-input textarea { flex:1; border:1px solid var(--gray-200); border-radius:20px; padding:9px 16px; font-size:14px; font-family:var(--font); resize:none; outline:none; max-height:80px; line-height:1.4; }
.chat-input textarea:focus { border-color:var(--primary); }
.send-btn { width:40px; height:40px; background:var(--primary); color:#fff; border:none; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:active { transform:scale(.9); }
.send-btn:disabled { background:var(--gray-300); }

/* 工单管理 */
.ticket-header { padding:14px; background:#fff; border-bottom:1px solid var(--gray-100); flex-shrink:0; }
.ticket-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat-card { text-align:center; padding:10px 6px; border-radius:var(--radius-sm); }
.stat-card.pending { background:var(--warning-light); }
.stat-card.processing { background:var(--primary-light); }
.stat-card.done { background:#DCFCE7; }
.stat-card .num { font-size:20px; font-weight:700; }
.stat-card.pending .num { color:#B45309; }
.stat-card.processing .num { color:var(--primary-dark); }
.stat-card.done .num { color:#15803D; }
.stat-card .label { font-size:10px; color:var(--gray-500); margin-top:2px; }

.ticket-list { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.ticket-item { background:#fff; border-radius:var(--radius); padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); border-left:4px solid var(--warning); }
.ticket-item.urgent { border-left-color:var(--danger); }
.ticket-item.processing { border-left-color:var(--primary); }
.ticket-item.done { border-left-color:var(--accent); opacity:.7; }
.ticket-item .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.ticket-item .tid { font-size:13px; font-weight:600; color:var(--gray-700); }
.ticket-item .pri-tag { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; }
.pri-tag.normal { background:var(--warning-light); color:#92400E; }
.pri-tag.urgent { background:var(--danger-light); color:#991B1B; }
.ticket-item .summary { font-size:13px; color:var(--gray-700); line-height:1.5; margin-bottom:8px; }
.ticket-item .bottom-row { display:flex; justify-content:space-between; align-items:center; }
.ticket-item .time { font-size:11px; color:var(--gray-400); }
.ticket-actions { display:flex; gap:6px; }
.ticket-actions button { padding:5px 12px; border-radius:6px; font-size:12px; border:none; cursor:pointer; font-weight:500; }
.btn-processing { background:var(--primary-light); color:var(--primary); }
.btn-done { background:#DCFCE7; color:#15803D; }
.status-label { font-size:12px; padding:3px 10px; border-radius:10px; font-weight:500; }
.status-label.pending { background:var(--warning-light); color:#B45309; }
.status-label.processing { background:var(--primary-light); color:var(--primary-dark); }
.status-label.done { background:#DCFCE7; color:#15803D; }

.empty-state { text-align:center; padding:50px 20px; color:var(--gray-400); }
.empty-state .icon { font-size:40px; margin-bottom:10px; }

.toast { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px); background:rgba(0,0,0,.8); color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; z-index:1000; opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.agent-badge { display:inline-flex; align-items:center; gap:4px; background:linear-gradient(135deg,#8B5CF6,#6366F1); color:#fff; font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500; }

@media (min-width:768px) {
  body { background:var(--gray-200); align-items:center; }
  .app { height:90vh; max-height:900px; border-radius:24px; overflow:hidden; }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h1>小助手 <span class="agent-badge">⚡ Agent</span></h1>
      <p>在线 · Function Calling + RAG</p>
    </div>
    <div class="badge">v2.0</div>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">
      <span class="icon">💬</span>对话
    </button>
    <button class="tab-btn" data-tab="tickets" onclick="switchTab('tickets')">
      <span class="icon">📋</span>工单
      <span class="tab-badge" id="tabBadge" style="display:none">0</span>
    </button>
  </nav>

  <section class="page active" id="page-chat">
    <div class="chat-messages" id="chatMessages">
      <div class="time-divider">今天</div>
      <div class="msg ai">
        <div class="msg-avatar">🤖</div>
        <div class="bubble">
          您好！我是智能客服 Agent 小助手 😊<br>
          我可以帮您<b>查订单、查物流、搜商品、评估退货</b>，也能解答退货政策等常见问题。<br><br>
          复杂问题会自动帮您转接人工～请问有什么可以帮您？
        </div>
      </div>
    </div>
    <div class="quick-questions">
      <button class="quick-btn" onclick="sendQuick('查一下我的订单')">📦 查订单</button>
      <button class="quick-btn" onclick="sendQuick('订单ORD20260815001的物流')">🚚 查物流</button>
      <button class="quick-btn" onclick="sendQuick('退货需要什么条件')">↩️ 退货政策</button>
      <button class="quick-btn" onclick="sendQuick('你们有什么耳机')">🎧 搜商品</button>
      <button class="quick-btn" onclick="sendQuick('我要投诉！')">🔧 转人工</button>
    </div>
    <div class="chat-input">
      <textarea id="msgInput" rows="1" placeholder="试试问：我的订单到哪了？"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </section>

  <section class="page" id="page-tickets">
    <div class="ticket-header">
      <div class="ticket-stats">
        <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="label">⏳ 待处理</div></div>
        <div class="stat-card processing"><div class="num" id="statProcessing">0</div><div class="label">🔄 处理中</div></div>
        <div class="stat-card done"><div class="num" id="statDone">0</div><div class="label">✅ 已完成</div></div>
      </div>
    </div>
    <div class="ticket-list" id="ticketList"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='ai_cs_v2_tickets';
let ticketCounter=1;

function loadTickets(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}}
function saveTickets(t){localStorage.setItem(STORAGE_KEY,JSON.stringify(t))}

// 模拟数据库
const DB={
  orders:[
    {id:'ORD20260815001',status:'已发货',amount:299,items:'纯棉圆T恤 x2, 运动短裤 x1',tracking:'SF1234567890',carrier:'顺丰速运'},
    {id:'ORD20260818002',status:'已签收',amount:1599,items:'无线降噪耳机 Pro x1',tracking:'JD9876543210',carrier:'京东物流'},
    {id:'ORD20260819003',status:'待发货',amount:458,items:'商务双肩包 x1',tracking:null,carrier:null}
  ],
  logistics:{
    'SF1234567890':{status:'运输中',location:'杭州西湖区文三路营业点',eta:'2026-08-20 18:00',updates:['商家已发货','到达杭州转运中心','正在派送']},
    'JD9876543210':{status:'已签收',location:'已签收，签收人：本人',eta:'已送达',updates:['商家已发货','到达杭州分拣中心','已签收']}
  },
  products:[
    {id:'P002',name:'无线降噪耳机 Pro',price:1599,original:1999,specs:'蓝牙5.3 | 40h续航 | 42dB降噪',stock:86},
    {id:'P001',name:'纯棉圆领T恤',price:89,original:129,specs:'100%纯棉 | S-XXL | 三色可选',stock:520},
    {id:'P003',name:'商务双肩包',price:458,original:599,specs:'防水牛津布 | 25L | 15.6寸笔记本',stock:200}
  ]
};

// Agent 意图识别 + 工具调用模拟
function agentProcess(message){
  const msg=message.toLowerCase();
  const steps=[];
  let reply='';
  let ticket=null;

  // 紧急关键词 → 直接转人工
  const urgent=['投诉','赔偿','律师','315','举报','起诉'];
  if(urgent.some(k=>message.includes(k))){
    steps.push({tool:'keyword_gate',args:'紧急关键词检测',result:'命中，直接转人工'});
    ticket=createTicket(message,'用户消息含紧急关键词',true);
    return{reply:'非常抱歉给您带来不好的体验 😔\n\n您的问题已升级为**紧急工单**，我们将优先安排人工客服处理，请稍候！',steps,ticket};
  }

  // 转人工关键词
  if(['转人工','人工客服','找人'].some(k=>message.includes(k))){
    steps.push({tool:'escalate_to_human',args:'reason: 用户要求转人工',result:'工单已创建'});
    ticket=createTicket(message,'用户主动要求转人工',false);
    return{reply:'好的，已为您转接人工客服 👩‍💼\n客服人员会尽快与您联系，请耐心等待～',steps,ticket};
  }

  // 查物流
  if(/物流|快递|到哪|配送|运单/.test(message)){
    const orderMatch=message.match(/ORD\d+/);
    let order=orderMatch?DB.orders.find(o=>o.id===orderMatch[0]):DB.orders.find(o=>o.tracking);
    if(order){
      steps.push({tool:'query_logistics',args:`order_id: ${order.id}`,result:`${order.carrier} ${order.tracking}`});
      if(order.tracking){
        const log=DB.logistics[order.tracking];
        if(log){
          reply=`您的订单 **${order.id}** 物流信息 🚚\n\n`;
          reply+=`📦 商品：${order.items}\n`;
          reply+=`🚛 承运：${order.carrier}（${order.tracking}）\n`;
          reply+=`📍 当前状态：**${log.status}** — ${log.location}\n`;
          reply+=`⏰ 预计送达：${log.eta}\n\n`;
          reply+=`物流轨迹：\n`;
          log.updates.forEach((u,i)=>reply+=`${i+1}. ${u}\n`);
        }
      }else{
        reply=`您的订单 **${order.id}** 当前状态为「待发货」，尚未生成物流信息。\n\n预计 24 小时内发货，请耐心等待～`;
      }
      return{reply,steps,ticket};
    }
  }

  // 查订单
  if(/订单|下单|买了|购买记录/.test(message) && !/物流/.test(message)){
    const orderMatch=message.match(/ORD\d+/);
    if(orderMatch){
      const order=DB.orders.find(o=>o.id===orderMatch[0]);
      if(order){
        steps.push({tool:'query_order',args:`order_id: ${order.id}`,result:`状态: ${order.status}`});
        reply=`📦 订单详情：\n\n`;
        reply+=`订单号：**${order.id}**\n`;
        reply+=`状态：**${order.status}**\n`;
        reply+=`商品：${order.items}\n`;
        reply+=`金额：¥${order.amount}\n`;
        if(order.carrier)reply+=`物流：${order.carrier} ${order.tracking}\n`;
        return{reply,steps,ticket};
      }
    }else{
      steps.push({tool:'query_order',args:'user_id: U10086',result:`${DB.orders.length}个订单`});
      reply=`您共有 **${DB.orders.length}** 个订单 📋\n\n`;
      DB.orders.forEach((o,i)=>{
        reply+=`${i+1}. **${o.id}** — ${o.status} — ¥${o.amount}\n   ${o.items}\n`;
      });
      reply+=`\n需要查看哪个订单的详情？告诉我订单号即可～`;
      return{reply,steps,ticket};
    }
  }

  // 搜商品
  if(/商品|产品|耳机|T恤|背包|短裤|有什么|搜一下|搜索/.test(message)){
    let results=DB.products;
    if(/耳机|耳/.test(message))results=DB.products.filter(p=>p.name.includes('耳机'));
    else if(/T恤|衣服|短/.test(message))results=DB.products.filter(p=>p.name.includes('T恤'));
    else if(/包|背包/.test(message))results=DB.products.filter(p=>p.name.includes('双肩包'));
    steps.push({tool:'query_product',args:`keyword: ${message.slice(0,10)}`,result:`找到${results.length}个商品`});
    reply=`为您找到以下商品 🔍\n\n`;
    results.forEach(p=>{
      reply+=`**${p.name}**（${p.id}）\n`;
      reply+=`💰 ¥${p.price}（原价 ¥${p.original}）\n`;
      reply+=`📐 ${p.specs}\n`;
      reply+=`📦 库存：${p.stock} 件\n\n`;
    });
    return{reply,steps,ticket};
  }

  // 退货政策（RAG）
  if(/退货|退款|换货|售后|退/.test(message)){
    steps.push({tool:'rag_search',args:'query: 退货政策',result:'命中3段知识库文档'});
    reply=`关于退换货，我来为您说明 ↩️\n\n`;
    reply+=`📋 **退货条件：**\n`;
    reply+=`• 签收后 7 天内可申请无理由退货\n`;
    reply+=`• 商品需保持原包装、未使用\n`;
    reply+=`• 质量问题 48 小时内联系客服\n\n`;
    reply+=`🚚 **运费：** 质量问题平台承担，无理由退货买家承担\n\n`;
    reply+=`💰 **退款时效：** 仓库验收后 1-3 个工作日原路退回\n`;
    reply+=`• 微信/支付宝：1-2 天\n`;
    reply+=`• 银行卡：3-5 天\n\n`;
    if(/退款|退钱/.test(message)){
      steps.push({tool:'calculate_return',args:'order_id: ORD20260815001',result:'可退 ¥299'});
      reply+=`如果您需要退货，可以告诉我订单号，我帮您评估退款金额。或者我帮您转接人工客服处理？`;
    }else{
      reply+=`需要我帮您评估具体订单的退货可行性吗？`;
    }
    return{reply,steps,ticket};
  }

  // 默认回复
  steps.push({tool:'llm_generate',args:'直接生成回复',result:'基于上下文回答'});
  reply=`感谢您的咨询！我可以帮您查订单、查物流、搜商品或解答退货政策 😊\n\n您可以试试：\n• "查一下我的订单"\n• "物流到哪了"\n• "你们有什么耳机"\n• "退货怎么退"`;
  return{reply,steps,ticket};
}

function createTicket(message,reason,urgent){
  const tickets=loadTickets();
  const now=new Date();
  const ts=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const t={id:ticketCounter++,summary:(reason+'：'+message).slice(0,80),priority:urgent?'urgent':'normal',status:'pending',created_at:ts};
  tickets.unshift(t);
  saveTickets(tickets);
  updateTicketUI();
  return t;
}

const chatMessages=document.getElementById('chatMessages');
const msgInput=document.getElementById('msgInput');

function addMessage(role,content,steps,ticket){
  const msg=document.createElement('div');
  msg.className=`msg ${role}`;
  const avatar=document.createElement('div');
  avatar.className='msg-avatar';
  avatar.textContent=role==='ai'?'🤖':'👤';
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.innerHTML=content.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');

  if(steps&&steps.length){
    const trace=document.createElement('div');
    trace.className='tool-trace';
    let html='<div class="tool-title">⚡ Agent 工具调用</div>';
    steps.forEach((s,i)=>{
      html+=`<div class="tool-step"><span class="tool-icon">🔧</span><div><b>${s.tool}</b>(${s.args})<br><span class="tool-result">→ ${s.result}</span></div></div>`;
    });
    trace.innerHTML=html;
    bubble.appendChild(trace);
  }
  if(ticket){
    const card=document.createElement('div');
    card.className=`ticket-card ${ticket.priority==='urgent'?'urgent':''}`;
    card.innerHTML=`<div class="ticket-id">🎫 工单 #${ticket.id}</div>紧急程度：${ticket.priority==='urgent'?'🔴 紧急':'🟡 普通'}<br>状态：⏳ 待处理<br>人工客服将尽快联系您`;
    bubble.appendChild(card);
  }
  msg.appendChild(avatar);msg.appendChild(bubble);
  chatMessages.appendChild(msg);
  scrollToBottom();
}

function showTyping(){
  const t=document.createElement('div');t.className='typing';t.id='typingInd';
  t.innerHTML='<div class="msg-avatar">🤖</div><div class="dots"><span></span><span></span><span></span></div>';
  chatMessages.appendChild(t);scrollToBottom();
}
function removeTyping(){const e=document.getElementById('typingInd');if(e)e.remove()}
function scrollToBottom(){requestAnimationFrame(()=>chatMessages.scrollTop=chatMessages.scrollHeight)}

function sendMessage(){
  const text=msgInput.value.trim();if(!text)return;
  addMessage('user',text);
  msgInput.value='';
  showTyping();
  setTimeout(()=>{
    removeTyping();
    const result=agentProcess(text);
    addMessage('ai',result.reply,result.steps,result.ticket);
  },700+Math.random()*600);
}
function sendQuick(t){msgInput.value=t;sendMessage()}
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${tab}`));
  if(tab==='tickets'){updateTicketUI();document.getElementById('tabBadge').style.display='none'}
}

function updateTicketUI(){
  const tickets=loadTickets();
  const p=tickets.filter(t=>t.status==='pending').length;
  const pr=tickets.filter(t=>t.status==='processing').length;
  const d=tickets.filter(t=>t.status==='done').length;
  document.getElementById('statPending').textContent=p;
  document.getElementById('statProcessing').textContent=pr;
  document.getElementById('statDone').textContent=d;
  const badge=document.getElementById('tabBadge');
  if(p>0){badge.textContent=p;badge.style.display='flex'}else{badge.style.display='none'}
  const list=document.getElementById('ticketList');
  if(!tickets.length){list.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>暂无工单<br><small>复杂问题会自动生成工单</small></p></div>';return}
  list.innerHTML=tickets.map(t=>{
    const st={pending:'⏳ 待处理',processing:'🔄 处理中',done:'✅ 已完成'};
    const pr=t.priority==='urgent'?'🔴 紧急':'🟡 普通';
    let acts='';
    if(t.status==='pending')acts=`<button class="btn-processing" onclick="act(${t.id},'processing')">处理中</button><button class="btn-done" onclick="act(${t.id},'done')">完成</button>`;
    else if(t.status==='processing')acts=`<button class="btn-done" onclick="act(${t.id},'done')">标记完成</button>`;
    else acts=`<span class="status-label done">已完成</span>`;
    return`<div class="ticket-item ${t.priority==='urgent'?'urgent':''} ${t.status}"><div class="top-row"><span class="tid">🎫 #${t.id}</span><span class="pri-tag ${t.priority}">${pr}</span></div><div class="summary">${t.summary}</div><div class="bottom-row"><span class="time">🕐 ${t.created_at}</span><div class="ticket-actions">${acts}</div></div></div>`;
  }).join('');
}
function act(id,st){
  const tickets=loadTickets();const t=tickets.find(x=>x.id===id);if(t){t.status=st;saveTickets(tickets);updateTicketUI()}
  showToast(st==='processing'?'已标记处理中 🔄':'工单已完成 ✅');
}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2000)}

updateTicketUI();
</script>
</body>
</html>
