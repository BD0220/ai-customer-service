<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能客服工单系统 v2.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f8f9fa;
    color: #1f2937;
    min-height: 100vh;
  }
  /* Gradio-like container */
  .gradio-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  /* Title */
  .app-title {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    color: #111827;
  }
  .app-subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 20px;
  }
  /* Tabs - mimic Gradio tab style */
  .tab-nav {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #e5e7eb;
    margin-bottom: 0;
  }
  .tab-btn {
    padding: 10px 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    color: #6b7280;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab-btn.active {
    color: #f97316;
    border-bottom-color: #f97316;
  }
  .tab-btn:hover { color: #f97316; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Gradio-like panel */
  .gr-panel {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
  }

  /* Chat area - mimic gr.Chatbot */
  .chatbot-wrap {
    background: #f8f9fa;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    height: 500px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chatbot-wrap::-webkit-scrollbar { width: 6px; }
  .chatbot-wrap::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  .msg-row { display: flex; gap: 8px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .avatar.bot { background: #f3f4f6; }
  .avatar.user { background: #f97316; color: #fff; font-size: 14px; font-weight: 600; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  .bubble.bot { background: #fff; border: 1px solid #e5e7eb; border-top-left-radius: 4px; }
  .bubble.user { background: #f97316; color: #fff; border-top-right-radius: 4px; }
  .bubble.bot.thinking { color: #6b7280; font-style: italic; }
  .bubble .trace-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #d1d5db;
    font-size: 13px;
    color: #4b5563;
  }
  .trace-item {
    background: #f3f4f6;
    border-radius: 4px;
    padding: 4px 8px;
    margin: 4px 0;
    font-family: monospace;
    font-size: 12px;
  }
  .trace-item .tool-name { color: #059669; font-weight: 600; }
  .ticket-box {
    margin-top: 10px;
    padding: 8px 12px;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    border-radius: 6px;
    font-size: 13px;
  }
  .ticket-box.urgent { background: #fee2e2; border-color: #fca5a5; }

  /* Typing dots */
  .typing { display: inline-flex; gap: 4px; }
  .typing span {
    width: 6px; height: 6px; background: #9ca3af; border-radius: 50%;
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* Input area */
  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .gr-input {
    flex: 8;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .gr-input:focus { border-color: #f97316; box-shadow: 0 0 0 2px rgba(249,115,22,0.1); }
  .gr-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .gr-btn.primary { background: #f97316; color: #fff; }
  .gr-btn.primary:hover { background: #ea580c; }
  .gr-btn.secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .gr-btn.secondary:hover { background: #e5e7eb; }
  .gr-btn.sm { padding: 6px 14px; font-size: 13px; }
  .reset-row { margin-top: 8px; }

  /* Examples - mimic gr.Examples */
  .examples-wrap {
    margin-top: 16px;
  }
  .examples-label {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .examples-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .example-chip {
    padding: 6px 12px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    color: #374151;
  }
  .example-chip:hover { border-color: #f97316; color: #f97316; }

  /* Ticket tab */
  .stats-bar {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 14px;
  }
  .gr-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 0;
  }
  .gr-table th {
    background: #f9fafb;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: #374151;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
  }
  .gr-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #f3f4f6;
    vertical-align: top;
  }
  .gr-table tr:hover td { background: #fafafa; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.processing { background: #dbeafe; color: #1e40af; }
  .badge.done { background: #d1fae5; color: #065f46; }
  .badge.normal { background: #fef3c7; color: #92400e; }
  .badge.urgent { background: #fee2e2; color: #991b1b; }
  .ticket-controls {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .ticket-controls .gr-input { flex: 2; min-width: 150px; }
  .status-msg {
    margin-top: 8px;
    font-size: 13px;
    color: #059669;
  }

  @media (max-width: 640px) {
    .chatbot-wrap { height: 420px; }
    .bubble { max-width: 85%; }
    .gr-panel { padding: 12px; }
    .input-row { flex-direction: column; }
    .gr-btn { width: 100%; }
    .gr-table { font-size: 12px; }
    .gr-table th, .gr-table td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<div class="gradio-container">
  <h1 class="app-title">🤖 AI 智能客服工单系统</h1>
  <p class="app-subtitle">LLM Agent · Function Calling · RAG · 多轮对话 | 自动解决率目标 70%+</p>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="chat">💬 客服对话</button>
    <button class="tab-btn" data-tab="tickets">📋 工单管理</button>
  </div>

  <!-- ====== 客服对话页 ====== -->
  <div class="tab-panel active" id="panel-chat">
    <div class="gr-panel" style="margin-top:0; border-top:none; border-top-left-radius:0; border-top-right-radius:0;">
      <div class="chatbot-wrap" id="chatbot"></div>

      <div class="input-row">
        <input type="text" class="gr-input" id="msgInput"
          placeholder="试试问：我的订单到哪了？退货政策是什么？耳机有什么颜色？">
        <button class="gr-btn primary" id="sendBtn">发送 🚀</button>
      </div>

      <div class="reset-row">
        <button class="gr-btn secondary sm" id="resetBtn">🔄 新对话</button>
      </div>

      <div class="examples-wrap">
        <div class="examples-label">💡 试试这些问题（多轮对话也可以）</div>
        <div class="examples-list" id="examplesList"></div>
      </div>
    </div>
  </div>

  <!-- ====== 工单管理页 ====== -->
  <div class="tab-panel" id="panel-tickets">
    <div class="stats-bar" id="statsBar">📊 加载中...</div>
    <div class="gr-panel" style="margin-top:12px; padding:0; overflow-x:auto;">
      <table class="gr-table">
        <thead>
          <tr>
            <th>工单号</th>
            <th>问题摘要</th>
            <th>紧急程度</th>
            <th>状态</th>
            <th>会话ID</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody id="ticketBody"></tbody>
      </table>
    </div>
    <div class="ticket-controls">
      <input type="text" class="gr-input" id="ticketIdInput" placeholder="例如：1" style="flex:2;">
      <button class="gr-btn secondary" id="btnProcessing">标记为处理中 🔄</button>
      <button class="gr-btn primary" id="btnDone">标记为已完成 ✅</button>
      <button class="gr-btn secondary" id="btnRefresh">刷新列表 🔄</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script>
// ============ 模拟数据 ============
const ORDERS = {
  "ORD20260815001": { order_id: "ORD20260815001", status: "已发货", product: "无线蓝牙耳机 Pro", amount: 299, created_at: "2026-08-15", logistics_id: "SF1234567890" },
  "ORD20260818002": { order_id: "ORD20260818002", status: "已签收", product: "手机壳（透明款）", amount: 39, created_at: "2026-08-18", logistics_id: "JD9876543210" },
  "ORD20260819003": { order_id: "ORD20260819003", status: "待发货", product: "Type-C 数据线 2m", amount: 29, created_at: "2026-08-19", logistics_id: null },
};
const LOGISTICS = {
  "SF1234567890": { tracking_no: "SF1234567890", carrier: "顺丰速运", status: "运输中", latest: "快件已到达【沈阳转运中心】，预计明日送达", steps: ["已揽收", "已发往沈阳", "到达沈阳转运中心", "派送中"] },
  "JD9876543210": { tracking_no: "JD9876543210", carrier: "京东物流", status: "已签收", latest: "快件已由本人签收", steps: ["已揽收", "运输中", "派送中", "已签收"] },
};
const PRODUCTS = [
  { id: "P001", name: "无线蓝牙耳机 Pro", price: 299, colors: ["黑色", "白色", "蓝色"], stock: "有货" },
  { id: "P002", name: "手机壳（透明款）", price: 39, colors: ["透明"], stock: "有货" },
  { id: "P003", name: "Type-C 数据线 2m", price: 29, colors: ["白色", "黑色"], stock: "有货" },
];

// RAG 知识库片段
const KB = {
  "退货": "退货政策：签收后7天内可无理由退货，商品需保持完好。质量问题15天内可退换。退款在收到退回商品并验收后3-5个工作日原路返回。",
  "退款": "退款说明：退款将在收到退回商品并验收后3-5个工作日内原路退回。如超过7个工作日未收到，请联系客服。",
  "保修": "保修政策：本产品享受一年质保服务，非人为损坏可免费维修。请保留订单号作为保修凭证。",
  "发票": "发票说明：下单时可选择开具电子发票，发票将在订单完成后1-3个工作日发送至您的邮箱。",
  "配送": "配送说明：一般48小时内发货，顺丰/京东配送，预计2-4天送达。偏远地区可能延长1-2天。",
};

// 模拟工单
let tickets = [
  { id: 1, summary: "用户反馈蓝牙耳机连接不稳定，要求换货", priority: "normal", status: "pending", session_id: "sess_a1b2c3d4e5f6", created_at: "2026-08-19 09:15:22" },
  { id: 2, summary: "用户投诉商品有质量问题，情绪激动，要求赔偿", priority: "urgent", status: "processing", session_id: "sess_b2c3d4e5f6a7", created_at: "2026-08-19 10:03:45" },
];
let nextTicketId = 3;

// ============ 模拟 Agent 回复逻辑 ============
function findOrderId(msg) {
  const m = msg.match(/ORD\d{12}/);
  return m ? m[0] : null;
}
function hasKeyword(msg, kws) {
  return kws.some(k => msg.includes(k));
}

// 模拟 ReAct 思考 + 工具调用 + 回复
function simulateAgent(msg) {
  const trace = [];
  let round = 0;

  // 紧急关键词 → 直接转人工
  if (hasKeyword(msg, ["投诉", "赔偿", "律师", "315", "12315", "举报", "起诉"])) {
    const tid = createTicket(msg, "urgent");
    return {
      reply: "非常抱歉给您带来不好的体验！您的诉求我已经记录，已为您转接人工客服优先处理，请您稍等片刻。",
      trace: [{ round: 1, tool: "keyword_gate", args: {}, result: "urgent_keyword_matched" }],
      ticket: { id: tid, priority: "urgent" },
    };
  }

  // 查物流
  if (hasKeyword(msg, ["物流", "到哪", "快递", "发货", "派送", "运单"])) {
    const oid = findOrderId(msg);
    if (oid && ORDERS[oid] && ORDERS[oid].logistics_id) {
      round++;
      trace.push({ round, tool: "query_order", args: { order_id: oid }, result: `订单${oid}：${ORDERS[oid].status}，${ORDERS[oid].product}` });
      const lid = ORDERS[oid].logistics_id;
      round++;
      trace.push({ round, tool: "query_logistics", args: { tracking_no: lid }, result: `${LOGISTICS[lid].carrier} ${LOGISTICS[lid].status}：${LOGISTICS[lid].latest}` });
      return {
        reply: `您的订单【${oid}】（${ORDERS[oid].product}）当前状态：${ORDERS[oid].status}。\n\n物流信息：${LOGISTICS[lid].carrier}（${lid}）\n📦 ${LOGISTICS[lid].latest}\n\n预计很快就能送达，请耐心等待哦！😊`,
        trace,
      };
    }
    if (oid && ORDERS[oid] && !ORDERS[oid].logistics_id) {
      trace.push({ round: 1, tool: "query_order", args: { order_id: oid }, result: `订单${oid}：待发货` });
      return {
        reply: `您的订单【${oid}】目前状态是「待发货」，我们正在加紧备货，预计48小时内发出，请您耐心等待！`,
        trace,
      };
    }
    // 列出订单
    round++;
    trace.push({ round, tool: "query_order", args: { user_id: "U10086" }, result: `找到3个订单：${Object.keys(ORDERS).join(", ")}` });
    return {
      reply: `您目前有以下订单：\n1. ORD20260815001 - 无线蓝牙耳机 Pro（已发货）\n2. ORD20260818002 - 手机壳（透明款）（已签收）\n3. ORD20260819003 - Type-C 数据线 2m（待发货）\n\n请问您要查哪个订单的物流呢？`,
      trace,
    };
  }

  // 查订单
  if (hasKeyword(msg, ["订单", "买了什么", "下单"])) {
    const oid = findOrderId(msg);
    if (oid && ORDERS[oid]) {
      round++;
      trace.push({ round, tool: "query_order", args: { order_id: oid }, result: JSON.stringify(ORDERS[oid]) });
      return {
        reply: `您的订单信息如下：\n📦 订单号：${oid}\n🛍️ 商品：${ORDERS[oid].product}\n💰 金额：¥${ORDERS[oid].amount}\n📅 下单时间：${ORDERS[oid].created_at}\n📍 当前状态：${ORDERS[oid].status}`,
        trace,
      };
    }
    round++;
    trace.push({ round, tool: "query_order", args: { user_id: "U10086" }, result: `找到3个订单` });
    return {
      reply: `您目前有以下订单：\n1. ORD20260815001 - 无线蓝牙耳机 Pro（已发货）\n2. ORD20260818002 - 手机壳（透明款）（已签收）\n3. ORD20260819003 - Type-C 数据线 2m（待发货）\n\n需要查哪个订单的详情呢？`,
      trace,
    };
  }

  // 退货
  if (hasKeyword(msg, ["退货", "退了", "退回", "换货"])) {
    round++;
    trace.push({ round, tool: "calculate_return", args: { order_id: findOrderId(msg) || "ORD20260815001", days_since_order: 4 }, result: '{"eligible": true, "refund_estimate": 299, "reason": "7天无理由退货期内"}' });
    return {
      reply: `${KB["退货"]}\n\n根据您的订单情况，目前在7天无理由退货期内，可以申请退货。您可以在订单详情页点击"申请退货"，或我帮您转接人工客服处理。`,
      trace,
    };
  }
  if (hasKeyword(msg, ["退款", "钱什么时候", "退钱"])) {
    return { reply: KB["退款"], trace: [] };
  }

  // 商品咨询
  if (hasKeyword(msg, ["耳机", "手机壳", "数据线", "有什么", "商品", "颜色", "价格", "多少钱"])) {
    round++;
    trace.push({ round, tool: "query_product", args: { keyword: msg.includes("耳机") ? "耳机" : msg.includes("手机壳") ? "手机壳" : "数据线" }, result: `找到${PRODUCTS.length}个商品` });
    let reply = "我们目前有以下商品：\n\n";
    PRODUCTS.forEach(p => {
      reply += `🛍️ ${p.name}\n   💰 ¥${p.price} | 🎨 颜色：${p.colors.join("、")} | 📦 ${p.stock}\n\n`;
    });
    reply += "有您感兴趣的吗？😊";
    return { reply, trace };
  }

  // 保修
  if (hasKeyword(msg, ["保修", "质保", "维修"])) {
    return { reply: KB["保修"], trace: [] };
  }

  // 发票
  if (hasKeyword(msg, ["发票", "开票"])) {
    return { reply: KB["发票"], trace: [] };
  }

  // 配送
  if (hasKeyword(msg, ["多久到", "几天", "配送", "送货"])) {
    return { reply: KB["配送"], trace: [] };
  }

  // 转人工
  if (hasKeyword(msg, ["转人工", "人工客服", "找人"])) {
    const tid = createTicket(msg, "normal");
    trace.push({ round: 1, tool: "escalate_to_human", args: { reason: "用户主动要求转人工" }, result: `工单 #${tid} 已创建` });
    return {
      reply: "好的，已为您转接人工客服，请稍候～",
      trace,
      ticket: { id: tid, priority: "normal" },
    };
  }

  // 你好 / 问候
  if (hasKeyword(msg, ["你好", "您好", "在吗", "hi", "hello", "嗨"])) {
    return { reply: "你好呀！我是智能客服小助手 😊 有什么可以帮您的吗？您可以查订单、查物流、咨询退货政策、了解商品信息哦～", trace: [] };
  }

  // 默认 → RAG + 兜底
  if (hasKeyword(msg, ["谢谢", "感谢", "多谢"])) {
    return { reply: "不客气！有问题随时找我哦～ 😊", trace: [] };
  }

  // 兜底转人工
  const tid = createTicket(msg, "normal");
  trace.push({ round: 1, tool: "escalate_to_human", args: { reason: "无法自动回答" }, result: `工单 #${tid} 已创建` });
  return {
    reply: "抱歉，这个问题我暂时无法准确回答，已为您转接人工客服，请稍候～",
    trace,
    ticket: { id: tid, priority: "normal" },
  };
}

function createTicket(summary, priority) {
  const id = nextTicketId++;
  tickets.push({
    id, summary: summary.slice(0, 80), priority, status: "pending",
    session_id: "sess_" + Math.random().toString(16).slice(2, 14),
    created_at: new Date().toLocaleString("zh-CN", { hour12: false }).replace(/\//g, "-"),
  });
  return id;
}

// ============ UI 渲染 ============
const chatbot = document.getElementById("chatbot");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const examplesList = document.getElementById("examplesList");

const EXAMPLES = [
  "你好，我想查一下我的订单",
  "订单 ORD20260815001 现在什么状态？",
  "帮我查下这个订单的物流",
  "退货需要什么条件？退款多久到账？",
  "你们有什么耳机？",
  "我要投诉！商品有质量问题！",
];
EXAMPLES.forEach(ex => {
  const chip = document.createElement("div");
  chip.className = "example-chip";
  chip.textContent = ex;
  chip.onclick = () => { msgInput.value = ex; sendMessage(); };
  examplesList.appendChild(chip);
});

function addMessage(role, text, trace, ticket) {
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar " + role;
  avatar.textContent = role === "bot" ? "🤖" : "我";
  const bubble = document.createElement("div");
  bubble.className = "bubble " + role;
  bubble.innerHTML = formatText(text);
  if (trace && trace.length > 0) {
    const traceDiv = document.createElement("div");
    traceDiv.className = "trace-section";
    traceDiv.innerHTML = "---<br>🔧 <b>Agent 工具调用过程：</b>";
    trace.forEach(t => {
      const argsStr = Object.entries(t.args).map(([k,v]) => `${k}=${v}`).join(", ");
      traceDiv.innerHTML += `<div class="trace-item">第${t.round}轮：<span class="tool-name">${t.tool}</span>(${argsStr})</div>`;
    });
    bubble.appendChild(traceDiv);
  }
  if (ticket) {
    const box = document.createElement("div");
    box.className = "ticket-box" + (ticket.priority === "urgent" ? " urgent" : "");
    box.innerHTML = `🎫 <b>工单号：</b>#${ticket.id} | <b>级别：</b>${ticket.priority === "urgent" ? "🔴 紧急" : "🟡 普通"}`;
    bubble.appendChild(box);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatbot.appendChild(row);
  chatbot.scrollTop = chatbot.scrollHeight;
  return row;
}

function showThinking() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "thinkingRow";
  const avatar = document.createElement("div");
  avatar.className = "avatar bot";
  avatar.textContent = "🤖";
  const bubble = document.createElement("div");
  bubble.className = "bubble bot thinking";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatbot.appendChild(row);
  chatbot.scrollTop = chatbot.scrollHeight;
}
function removeThinking() {
  const el = document.getElementById("thinkingRow");
  if (el) el.remove();
}

function formatText(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code style='background:#f3f4f6;padding:1px 4px;border-radius:3px;font-size:12px;'>$1</code>")
    .replace(/\n/g, "<br>");
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = "";
  addMessage("user", text);
  showThinking();
  setTimeout(() => {
    removeThinking();
    const result = simulateAgent(text);
    addMessage("bot", result.reply, result.trace, result.ticket);
    if (result.ticket) renderTickets();
  }, 800 + Math.random() * 700);
}

sendBtn.onclick = sendMessage;
msgInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
resetBtn.onclick = () => {
  chatbot.innerHTML = "";
  addMessage("bot", "对话已重置。你好呀！我是智能客服小助手 😊 有什么可以帮您的吗？");
};

// Tabs
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "tickets") renderTickets();
  };
});

// ============ 工单管理 ============
function renderTickets() {
  const body = document.getElementById("ticketBody");
  body.innerHTML = "";
  let p = { pending: 0, processing: 0, done: 0, urgent: 0 };
  tickets.forEach(t => {
    p[t.status]++;
    if (t.priority === "urgent") p.urgent++;
    const tr = document.createElement("tr");
    const statusMap = { pending: "⏳ 待处理", processing: "🔄 处理中", done: "✅ 已完成" };
    const prioMap = { normal: "🟡 普通", urgent: "🔴 紧急" };
    tr.innerHTML = `
      <td>${t.id}</td>
      <td>${t.summary}</td>
      <td><span class="badge ${t.priority}">${prioMap[t.priority]}</span></td>
      <td><span class="badge ${t.status}">${statusMap[t.status]}</span></td>
      <td style="font-family:monospace;font-size:12px;">${t.session_id}</td>
      <td style="white-space:nowrap;">${t.created_at}</td>
    `;
    body.appendChild(tr);
  });
  document.getElementById("statsBar").innerHTML =
    `📊 <b>工单统计：</b> 总计 ${tickets.length} | ⏳ 待处理 ${p.pending} | 🔄 处理中 ${p.processing} | ✅ 已完成 ${p.done} | 🔴 紧急 ${p.urgent}`;
}

document.getElementById("btnProcessing").onclick = () => {
  const id = parseInt(document.getElementById("ticketIdInput").value);
  if (!id) { showStatus("请先输入工单号", false); return; }
  const t = tickets.find(x => x.id === id);
  if (t) { t.status = "processing"; renderTickets(); showStatus(`工单 #${id} 已标记为处理中 🔄`, true); }
  else showStatus(`工单 #${id} 不存在`, false);
};
document.getElementById("btnDone").onclick = () => {
  const id = parseInt(document.getElementById("ticketIdInput").value);
  if (!id) { showStatus("请先输入工单号", false); return; }
  const t = tickets.find(x => x.id === id);
  if (t) { t.status = "done"; renderTickets(); showStatus(`工单 #${id} 已标记为已完成 ✅`, true); }
  else showStatus(`工单 #${id} 不存在`, false);
};
document.getElementById("btnRefresh").onclick = () => { renderTickets(); showStatus("列表已刷新 🔄", true); };
function showStatus(msg, ok) {
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.style.color = ok ? "#059669" : "#dc2626";
}

// 初始欢迎消息
addMessage("bot", "你好呀！我是智能客服小助手 😊 我可以帮您查订单、查物流、咨询退货政策、了解商品信息。有什么可以帮您的吗？");
renderTickets();
</script>
</body>
