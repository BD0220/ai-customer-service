version: "3.8"

services:
  ai-cs-agent:
    build: .
    container_name: ai-cs-agent
    ports:
      - "8000:8000"   # API + 界面（单端口）
    env_file:
      - .env
    environment:
      - CS_DB_PATH=/data/customer_service.db
      - PYTHONPATH=/app/backend:/app/frontend
    volumes:
      # 数据库持久化到宿主机，容器重启不丢数据
      - cs-data:/data
    restart: unless-stopped

volumes:
  cs-data:
